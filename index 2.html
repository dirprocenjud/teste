*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f5f8fb,#eaf0f6);color:var(--ink);font:16px/1.5 "Segoe UI",Arial,sans-serif}

.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.82;font-weight:700}.header-title{font-size:clamp(25px,4vw,34px);font-weight:750;letter-spacing:-.03em;margin:6px 0 2px}.header-sub{font-size:14px;color:#e1ebf5;max-width:650px}
main{max-width:900px;margin:28px auto;padding:0 16px 44px}.panel{background:#fff;border:1px solid #e0e8f0;border-radius:20px;box-shadow:0 15px 45px #1937500d;padding:clamp(22px,5vw,40px);min-height:430px}

.kicker{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.question{color:var(--navy);font-size:clamp(23px,3.4vw,31px);line-height:1.22;letter-spacing:-.026em;margin:8px 0 11px;max-width:760px}.help{color:#64768a;margin:0 0 25px;max-width:760px;font-size:15px}

.notice{margin:18px 0;padding:14px 16px;border-radius:9px;border-left:4px solid var(--amber);background:#fff8e9;color:#674b17}.notice.info{border-left-color:#3679b3;background:#eef6fd;color:#284e73}.notice.success{border-left-color:var(--green);background:#edf8f2;color:#215a41}.notice.danger{border-left-color:var(--red);background:#fff0f1;color:#7e2b32}
.result-title{font-size:clamp(25px,3.5vw,32px);letter-spacing:-.025em;color:var(--navy);margin:8px 0 14px}.result-box{background:#f8fafc;border:1px solid #e1e9f1;border-radius:13px;padding:19px;margin:17px 0}.result-box h3{color:var(--navy);font-size:17px;margin:0 0 11px}.checklist{list-style:none;padding:0;margin:0}.checklist li{display:flex;gap:10px;margin:11px 0;color:#43566a}.checklist input{width:17px;height:17px;flex:0 0 17px;margin-top:4px;accent-color:var(--green)}.smallprint{font-size:12px;color:#8592a1;margin-top:18px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:29px;padding-top:19px;border-top:1px solid #edf1f5}.btn{border:0;border-radius:10px;padding:11px 18px;font:600 14px "Segoe UI",Arial,sans-serif;cursor:pointer;transition:.14s}.btn.secondary{background:#edf2f7;color:#38536e}.btn.secondary:hover{background:#e2eaf2}.btn.primary{background:var(--blue);color:#fff;box-shadow:0 4px 11px #2870b326}.btn.primary:hover{background:#1f5d98;transform:translateY(-1px)}.btn:focus-visible,.choice:focus-visible{outline:3px solid #a9cfeb;outline-offset:2px}.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.footer{text-align:center;color:#8995a4;font-size:11px;padding-bottom:25px}.pill{display:inline-block;padding:3px 8px;background:#edf5fb;border-radius:20px;color:#2c6492;font-size:11px;font-weight:700;margin-right:5px}
@media(max-width:620px){header{padding:20px}.panel{border-radius:16px;padding:21px 17px}main{margin:17px auto;padding:0 10px 30px}.track{margin-bottom:26px}.choice{padding:15px 14px}.controls{margin-top:24px}}

.lookup{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:8px}
.lookup input{width:100%;border:1px solid #cfdbe6;border-radius:11px;padding:14px 15px;font:inherit;color:var(--ink);background:#fff}

.lookup button:hover{background:#1f5d98}

.lookup-result{margin-top:16px}
@media(max-width:620px){.lookup{grid-template-columns:1fr}.lookup button{padding:12px 18px}}

function page(kicker,question,help,options){
 currentPage={kicker,question,help,options};
 stepLabel.textContent=kicker;
 progressLabel.textContent=`Etapa ${Math.min(history.length+1,6)}`;
 progressBar.style.width=`${Math.min(95,Math.max(15,(history.length+1)*14))}%`;
 backBtn.disabled=history.length===0;
 restartBtn.hidden=true;
 screen.innerHTML=`<div class="kicker">${kicker}</div><h2 class="question">${question}</h2><p class="help">${help||""}</p><div class="options">${options.map((o,i)=>`<button class="choice" type="button" data-index="${i}"><span class="dot"></span><span><strong>${o.label}</strong>${o.desc?`<small>${o.desc}</small>`:""}</span></button>`).join("")}</div>`;
 screen.querySelectorAll(".choice").forEach(button=>{
   button.addEventListener("click",()=>choose(Number(button.dataset.index)),{once:true});
 });
}

function choose(index){
 const selected=currentPage.options[index];
 if(!selected || typeof selected.action!=="function") return;
 screen.querySelectorAll(".choice").forEach(b=>b.disabled=true);
 const clicked=screen.querySelector(`[data-index="${index}"]`);
 if(clicked) clicked.classList.add("selected");
 history.push({page:currentPage,gender});
 setTimeout(()=>selected.action(),90);
}

function goBack(){
 if(!history.length)return;
 const previous=history.pop();
 gender=previous.gender;
 page(previous.page.kicker,previous.page.question,previous.page.help,previous.page.options);
}

function restart(){history=[];gender=null;executionCheck();}

function result(title,body,checks=commonChecks,kind="success"){

}

function outcome(court,meio,extra=""){
 const full=courtNames[court]||"";

}


function normalizeText(value){
 return value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/\s+/g," ");
}

 Object.entries(municipalityToCirc).map(([name,circ])=>[normalizeText(name),circ])
);
const regionByCirc={
 1:"Região Metropolitana",2:"Região Metropolitana",3:"Região Metropolitana",
 4:"Zona da Mata",5:"Zona da Mata",6:"Zona da Mata",
 7:"Agreste",8:"Agreste",9:"Agreste",10:"Agreste",11:"Agreste",12:"Agreste",19:"Agreste",
 13:"Sertão",14:"Sertão",15:"Sertão",16:"Sertão",17:"Sertão",18:"Sertão",20:"Sertão"
};
function circunscriptionLookup(context, callback){
 currentPage={kicker:`${context} · Localização`,question:"Qual é a cidade do endereço?",help:"Digite o nome da cidade para identificar a circunscrição judiciária correspondente.",options:[]};
 stepLabel.textContent=`${context} · Localização`;
 progressLabel.textContent=`Etapa ${Math.min(history.length+1,6)}`;
 progressBar.style.width=`${Math.min(95,Math.max(15,(history.length+1)*14))}%`;
 backBtn.disabled=history.length===0;
 restartBtn.hidden=true;
 const datalist=Object.keys(municipalityToCirc).sort((a,b)=>a.localeCompare(b,"pt-BR")).map(c=>`<option value="${c}">`).join("");
 screen.innerHTML=`
  <div class="kicker">${context} · Localização</div>
  <h2 class="question">Qual é a cidade do endereço?</h2>
  <p class="help">Digite o nome da cidade e pesquise a circunscrição judiciária correspondente.</p>
  <div class="lookup">
   <input id="cityInput" list="cityList" autocomplete="off" placeholder="Ex.: Petrolina" aria-label="Nome da cidade">
   <datalist id="cityList">${datalist}</datalist>
   <button type="button" id="citySearchBtn">Pesquisar</button>
  </div>
  <div class="lookup-note">A busca considera o nome da cidade, com ou sem acentuação.</div>
  <div id="cityResult" class="lookup-result"></div>`;
 const input=document.getElementById("cityInput");
 const btn=document.getElementById("citySearchBtn");
 function doSearch(){
  const raw=input.value.trim();
  const key=normalizeText(raw);
  const circ=normalizedMunicipalityToCirc[key];
  const box=document.getElementById("cityResult");
  if(!key){box.innerHTML='<div class="notice info">Digite o nome da cidade.</div>';return;}
  if(!circ){box.innerHTML='<div class="notice info">Cidade não localizada. Confira a grafia e tente novamente.</div>';return;}
  box.innerHTML=`<div class="notice success"><strong>${raw}</strong><br>${circ}ª Circunscrição Judiciária · ${regionByCirc[circ]||""}<div style="margin-top:10px"><button type="button" class="btn primary" id="useCircBtn">Usar esta circunscrição</button></div></div>`;
  document.getElementById("useCircBtn").addEventListener("click",()=>callback(circ,raw),{once:true});
 }
 btn.addEventListener("click",doSearch);
 input.addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});
}

function executionCheck(){
 page("Etapa 1 · Consulta ao SEEU","Já existe processo de execução penal para esta pessoa?","Faça a consulta no SEEU antes de definir o destino da nova guia.",[
  {label:"Sim, no TJPE",desc:"Verificar o processo de execução existente e seu status.",action:()=>activeProcess("TJPE")},

  {label:"Não existe execução",desc:"Prosseguir para a identificação e definição do caminho.",action:genderCheck},
  {label:"Ainda não consegui verificar",desc:"Confirmar essa informação antes de continuar.",action:()=>result("Consulta necessária","Pesquise no SEEU pelo RJI e pelos dados disponíveis. Confira cuidadosamente possíveis homônimos antes de concluir que não existe execução.",["Pesquisar no SEEU pelos dados disponíveis.","Confirmar a identidade da pessoa e o status encontrado.","Retomar o roteiro após a consulta."],"info")}
 ]);
